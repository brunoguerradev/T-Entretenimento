---
# Deploy pelo cPanel (Git Version Control > Manage > Pull or Deploy > Deploy HEAD Commit).
# Copia só os arquivos do site para a pasta do domínio tentretenimento.com.br.
# $HOME é a pasta da conta no cPanel (/home/usuario), então não precisa escrever o usuário.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/tentretenimento.com.br/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R index.html .htaccess robots.txt assets css js ingressos painel portaria $DEPLOYPATH
