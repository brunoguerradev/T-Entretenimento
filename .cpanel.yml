---
# Deploy pelo cPanel (Git Version Control > Manage > Pull or Deploy > Deploy HEAD Commit).
# Copia só os arquivos do site para a pasta pública. Troque USUARIO pelo usuário do cPanel
# e, se o site ficar num subdomínio/addon, troque public_html pela pasta dele.
deployment:
  tasks:
    - export DEPLOYPATH=/home/USUARIO/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R index.html .htaccess robots.txt assets css js ingressos painel portaria $DEPLOYPATH
